<!doctype html>
<html lang="fr">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>IGS Dossiers — Transit & Douane</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>

  <body>
    <div id="root">
      <div style="display:flex;height:100vh;width:100%;align-items:center;justify-content:center;background-color:#0b2923;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
        <div style="text-align:center;">
          <img src="/igs-logo-sidebar.png" alt="IGS Logistics" style="height:55px;margin-bottom:16px;object-fit:contain;" />
          <div style="width:120px;height:3px;background:rgba(255,255,255,0.15);border-radius:99px;margin:0 auto;overflow:hidden;">
            <div style="width:50%;height:100%;background:#d9a94b;border-radius:99px;animation:igspulse 0.8s infinite linear;"></div>
          </div>
          <style>@keyframes igspulse { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }</style>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics (Umami) - Disabled by default. Set VITE_ANALYTICS_ENDPOINT and VITE_ANALYTICS_WEBSITE_ID to enable -->
    <!-- <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script> -->
  </body>

</html>
